# Sobe a infraestrutura do backend:
#   Frontend (Next.js, fora do compose) -> Gateway :8080 -> Backend :8081 -> MySQL
# Uso:  docker compose up --build
name: ativos-ti

services:
  mysql:
    image: mysql:8.4
    container_name: ativos-mysql
    environment:
      MYSQL_DATABASE: ativos_ti
      MYSQL_USER: ${DB_USER:-ativos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ativos}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: America/Sao_Paulo
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ativos-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ativos_ti?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      DB_USER: ${DB_USER:-ativos}
      DB_PASSWORD: ${DB_PASSWORD:-ativos}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: ativos-gateway
    environment:
      BACKEND_URL: http://backend:8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  mysql-data:
