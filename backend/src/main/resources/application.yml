server:
  port: 8081

spring:
  application:
    name: ativos-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/ativos_ti?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
    username: ${DB_USER:ativos}
    password: ${DB_PASSWORD:ativos}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é gerenciado exclusivamente pelo Flyway (db/migration).
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
